<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .zone{fill:#f7f8fa;stroke:#9aa3ad;stroke-width:1.5;stroke-dasharray:6 4}
      .zlabel{font-size:14px;font-weight:700;fill:#555;letter-spacing:1.5px}
      .box{fill:#fff;stroke:#333;stroke-width:1.5}
      .fb{fill:#fff8e6;stroke:#f5a623;stroke-width:2}
      .ext{fill:#eef5ff;stroke:#4a7fd4;stroke-width:1.6}
      .t{font-size:16px;font-weight:700;fill:#111}
      .s{font-size:13px;fill:#333}
      .m{font-size:12.5px;fill:#333;font-family:Consolas, monospace}
      .ln{stroke:#333;stroke-width:1.6;fill:none}
      .lbl{font-size:12px;fill:#333;font-style:italic}
      .n{fill:#111}
      .nt{font-size:12px;font-weight:700;fill:#fff}
    </style>
  </defs>

  <rect width="1200" height="1000" fill="#fff"/>
  <text x="40" y="36" font-size="20" font-style="italic" fill="#111">System Architecture</text>

  <!-- CLIENT SIDE -->
  <rect class="zone" x="40" y="60" width="1120" height="200" rx="10"/>
  <text class="zlabel" x="58" y="84">CLIENT SIDE</text>

  <rect class="box" x="70" y="110" width="170" height="120" rx="8"/>
  <text class="t" x="155" y="160" text-anchor="middle">User</text>
  <text class="s" x="155" y="182" text-anchor="middle">Farmer / Breeder</text>

  <rect class="box" x="300" y="95" width="600" height="150" rx="10"/>
  <text class="t" x="600" y="120" text-anchor="middle">Palahi Mobile App (Flutter · Android)</text>
  <rect class="box" x="325" y="140" width="160" height="80" rx="6"/>
  <text class="t" x="405" y="175" text-anchor="middle" font-size="14">Views</text>
  <text class="s" x="405" y="195" text-anchor="middle">UI screens</text>
  <rect class="box" x="520" y="140" width="160" height="80" rx="6"/>
  <text class="t" x="600" y="175" text-anchor="middle" font-size="14">ViewModels</text>
  <text class="s" x="600" y="195" text-anchor="middle">state &amp; logic</text>
  <rect class="box" x="715" y="140" width="160" height="80" rx="6"/>
  <text class="t" x="795" y="175" text-anchor="middle" font-size="14">Repositories</text>
  <text class="s" x="795" y="195" text-anchor="middle">data access</text>
  <line class="ln" x1="485" y1="180" x2="518" y2="180" marker-end="url(#a)" marker-start="url(#a)"/>
  <line class="ln" x1="680" y1="180" x2="713" y2="180" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect class="box" x="960" y="110" width="170" height="120" rx="8"/>
  <text class="t" x="1045" y="140" text-anchor="middle">Device Services</text>
  <text class="s" x="1045" y="168" text-anchor="middle">GPS (Geolocator)</text>
  <text class="s" x="1045" y="190" text-anchor="middle">Camera / Gallery</text>
  <text class="s" x="1045" y="208" text-anchor="middle">(Image Picker)</text>

  <line class="ln" x1="240" y1="170" x2="298" y2="170" marker-end="url(#a)" marker-start="url(#a)"/>
  <line class="ln" x1="902" y1="170" x2="958" y2="170" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- INTERNET -->
  <line class="ln" x1="600" y1="245" x2="600" y2="288" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="40" y="290" width="1120" height="50" rx="10" fill="#e9ecef" stroke="#333" stroke-width="1.5"/>
  <text class="t" x="600" y="321" text-anchor="middle">Internet — HTTPS / TLS encrypted (Firebase SDK &amp; REST API calls)</text>

  <!-- FIREBASE -->
  <rect class="zone" x="40" y="380" width="780" height="420" rx="10"/>
  <text class="zlabel" x="58" y="788">SERVER SIDE — FIREBASE (GOOGLE CLOUD)</text>

  <rect class="fb" x="70" y="440" width="220" height="240" rx="10"/>
  <text class="t" x="180" y="470" text-anchor="middle">Firebase</text>
  <text class="t" x="180" y="490" text-anchor="middle">Authentication</text>
  <text class="s" x="88" y="524">• Email / username</text>
  <text class="s" x="100" y="542">  + password</text>
  <text class="s" x="88" y="566">• Google Sign-In</text>
  <text class="s" x="88" y="590">• Registration &amp;</text>
  <text class="s" x="100" y="608">  session handling</text>
  <text class="s" x="88" y="632">• Issues UID +</text>
  <text class="s" x="100" y="650">  ID token</text>

  <rect class="fb" x="330" y="440" width="180" height="240" rx="10"/>
  <text class="t" x="420" y="470" text-anchor="middle">Firestore</text>
  <text class="t" x="420" y="490" text-anchor="middle">Security Rules</text>
  <text class="s" x="345" y="524">• Checks request.auth</text>
  <text class="s" x="345" y="548">• Owner-only access</text>
  <text class="s" x="357" y="566">(auth.uid == userId)</text>
  <text class="s" x="345" y="590">• Allows / denies</text>
  <text class="s" x="357" y="608">each read &amp; write</text>

  <rect class="fb" x="550" y="440" width="240" height="340" rx="10"/>
  <text class="t" x="670" y="470" text-anchor="middle">Cloud Firestore</text>
  <text class="s" x="670" y="490" text-anchor="middle">(NoSQL, real-time)</text>
  <text class="m" x="572" y="518">users · usernames</text>
  <text class="m" x="572" y="540">breeders · stud_pigs</text>
  <text class="m" x="572" y="562">bookings</text>
  <text class="m" x="572" y="584">booking_slots</text>
  <text class="m" x="572" y="606">reviews · favorites</text>
  <text class="m" x="572" y="628">chat_rooms/messages</text>
  <text class="m" x="572" y="650">notifications</text>
  <text class="m" x="572" y="672">trip_locations</text>
  <text class="m" x="572" y="694">farmer_locations</text>
  <text class="s" x="572" y="728">Real-time listeners push</text>
  <text class="s" x="572" y="746">updates back to the app</text>

  <!-- arrows internet -> auth / rules -->
  <line class="ln" x1="180" y1="342" x2="180" y2="438" marker-end="url(#a)" marker-start="url(#a)"/>
  <circle class="n" cx="180" cy="370" r="11"/><text class="nt" x="180" y="374" text-anchor="middle">1</text>
  <text class="lbl" x="198" y="374">sign in / sign up</text>
  <line class="ln" x1="420" y1="342" x2="420" y2="438" marker-end="url(#a)"/>
  <circle class="n" cx="420" cy="370" r="11"/><text class="nt" x="420" y="374" text-anchor="middle">2</text>
  <text class="lbl" x="438" y="374">read / write + ID token</text>
  <!-- firestore -> internet (realtime) -->
  <line class="ln" x1="700" y1="438" x2="700" y2="342" marker-end="url(#a)"/>
  <circle class="n" cx="700" cy="370" r="11"/><text class="nt" x="700" y="374" text-anchor="middle">4</text>
  <text class="lbl" x="718" y="374">data / live updates</text>

  <line class="ln" x1="290" y1="560" x2="328" y2="560" marker-end="url(#a)"/>
  <text class="lbl" x="309" y="700" text-anchor="middle">verifies</text>
  <text class="lbl" x="309" y="714" text-anchor="middle">token</text>
  <line class="ln" x1="309" y1="690" x2="309" y2="562" stroke-dasharray="3 3"/>
  <line class="ln" x1="510" y1="560" x2="548" y2="560" marker-end="url(#a)"/>
  <circle class="n" cx="529" cy="530" r="11"/><text class="nt" x="529" y="534" text-anchor="middle">3</text>

  <!-- THIRD PARTY -->
  <rect class="zone" x="860" y="380" width="300" height="420" rx="10"/>
  <text class="zlabel" x="895" y="404">THIRD-PARTY SERVICES</text>
  <line class="ln" x1="875" y1="342" x2="875" y2="715"/>

  <rect class="ext" x="910" y="425" width="230" height="100" rx="8"/>
  <text class="t" x="1025" y="455" text-anchor="middle">Google Maps SDK</text>
  <text class="s" x="1025" y="478" text-anchor="middle">Map display, markers,</text>
  <text class="s" x="1025" y="496" text-anchor="middle">location picker</text>
  <line class="ln" x1="875" y1="475" x2="908" y2="475" marker-end="url(#a)"/>

  <rect class="ext" x="910" y="545" width="230" height="100" rx="8"/>
  <text class="t" x="1025" y="575" text-anchor="middle">OSRM Routing API</text>
  <text class="s" x="1025" y="598" text-anchor="middle">Road route for live</text>
  <text class="s" x="1025" y="616" text-anchor="middle">trip tracking</text>
  <line class="ln" x1="875" y1="595" x2="908" y2="595" marker-end="url(#a)"/>

  <rect class="ext" x="910" y="665" width="230" height="110" rx="8"/>
  <text class="t" x="1025" y="695" text-anchor="middle">Cloudinary</text>
  <text class="s" x="1025" y="718" text-anchor="middle">Image hosting (profile &amp;</text>
  <text class="s" x="1025" y="736" text-anchor="middle">stud pig photos) — URL</text>
  <text class="s" x="1025" y="754" text-anchor="middle">is saved in Firestore</text>
  <line class="ln" x1="875" y1="715" x2="908" y2="715" marker-end="url(#a)"/>
  <circle class="n" cx="875" cy="370" r="11"/><text class="nt" x="875" y="374" text-anchor="middle">5</text>

  <!-- FLOW LEGEND -->
  <text class="t" x="40" y="840">Data Flow</text>
  <g class="s" font-size="14">
    <text x="40" y="866"><tspan font-weight="700">1.</tspan> The user signs in or registers (email/username + password, or Google Sign-In). Firebase Authentication returns a UID and ID token.</text>
    <text x="40" y="890"><tspan font-weight="700">2.</tspan> Through its repositories, the app sends Firestore reads and writes over HTTPS, and each request carries the user’s ID token.</text>
    <text x="40" y="914"><tspan font-weight="700">3.</tspan> Firestore Security Rules check request.auth (the UID) before any read or write is allowed.</text>
    <text x="40" y="938"><tspan font-weight="700">4.</tspan> Firestore returns data, and real-time listeners push live updates (bookings, chats, notifications, trip location) to the app.</text>
    <text x="40" y="962"><tspan font-weight="700">5.</tspan> The app calls Google Maps (maps), OSRM (road routes) and Cloudinary (photo upload); the image URL Cloudinary returns is stored in Firestore.</text>
  </g>
</svg>
